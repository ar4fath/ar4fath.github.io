<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@arafath</title>
<style>
:root{--ink:#fff;--mute:#828282;--lav:214,208,255;--bg:#000}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding:20px;display:flex;font-family:Arial,sans-serif;color:var(--ink);overflow-x:hidden;overflow-y:auto;scrollbar-width:none;
background:radial-gradient(ellipse 85% 55% at 50% 115%,rgba(46,36,98,.15),transparent 70%),radial-gradient(ellipse 55% 45% at 12% -5%,rgba(26,26,66,.10),transparent 70%),radial-gradient(ellipse 40% 35% at 95% 40%,rgba(34,22,60,.07),transparent 70%),#000}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
body::-webkit-scrollbar{display:none}
.wrap{position:relative;z-index:1;width:100%;max-width:450px;min-width:300px;margin:auto}
.frame{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;filter:drop-shadow(0 0 4px rgba(214,208,255,.55))}
.card{position:relative;width:100%;overflow:visible;padding:20px 20px 14px;text-align:center;background:#000;border:2px solid;border-radius:10px;
border-image:linear-gradient(to bottom,#4d4d4d,rgb(var(--lav))) 1;animation:spin 5s linear infinite;box-shadow:0 0 12px rgba(var(--lav),.28),0 0 50px rgba(var(--lav),.06);transition:box-shadow .3s}
.card:hover{box-shadow:0 0 18px rgba(var(--lav),.42),0 0 60px rgba(var(--lav),.09)}
@keyframes spin{0%{border-image:linear-gradient(to bottom,#4d4d4d,rgb(var(--lav))) 1}25%{border-image:linear-gradient(to right,#4d4d4d,rgb(var(--lav))) 1}50%{border-image:linear-gradient(to top,#4d4d4d,rgb(var(--lav))) 1}75%{border-image:linear-gradient(to left,#4d4d4d,rgb(var(--lav))) 1}100%{border-image:linear-gradient(to bottom,#4d4d4d,rgb(var(--lav))) 1}}
.pw{position:relative;width:100px;height:100px;margin:25px auto 20px;border-radius:50%}
.pfp{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:1px solid rgba(var(--lav),.9);-webkit-user-drag:none;user-select:none}
.name{font-size:1.5em;font-weight:bold;margin-bottom:5px}
.sub{font-size:1em;font-weight:200;color:var(--mute);margin-bottom:6px;min-height:1.2em}
.meta{font-size:11px;color:#6f6f7a;margin-bottom:26px;min-height:14px}
.links{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;padding:0 4px 12px}
.links a{--bg:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;height:80px;padding:10px;border-radius:15px;background:#000;color:#fff;text-decoration:none;transition:background-color .3s,transform .3s}
.links a:hover,.links a:focus-visible{--bg:#1d1a33;background:#1d1a33;transform:scale(1.1);outline:none}
.links a:focus-visible{box-shadow:0 0 0 2px rgba(var(--lav),.8)}
.links svg{width:40px;height:40px;fill:#fff}
.links span{margin-top:10px;font-size:10px;color:#b0b0b0}
.k{stroke:var(--bg)}.kf{fill:var(--bg)}

.intro .card{background-color:rgba(0,0,0,0);border-image:none;border-color:transparent;box-shadow:none;animation:none}
.intro.s-card .card{background-color:#000;border-image:linear-gradient(to bottom,#4d4d4d,rgb(var(--lav))) 1;box-shadow:0 0 12px rgba(var(--lav),.28),0 0 50px rgba(var(--lav),.06);transition:background-color .5s,box-shadow .9s}
.intro .pfp{opacity:0}
.intro.s-pfp .pfp{opacity:1;transition:opacity .7s;animation:eyes 1.2s ease-out}
@keyframes eyes{0%{filter:brightness(.15);box-shadow:0 0 0 0 rgba(255,40,60,0)}45%{filter:brightness(1.15);box-shadow:0 0 30px 4px rgba(255,50,70,.75)}100%{filter:brightness(1);box-shadow:0 0 0 0 rgba(255,40,60,0)}}
.intro .name .l{opacity:0}
.intro.s-name .name .l{opacity:1;transition:opacity .1s;transition-delay:calc(var(--i)*55ms)}
.intro .sub{opacity:0}
.intro.s-yolo .sub{opacity:1;transition:opacity .5s}
.intro .links a{opacity:0;transform:translateY(10px)}
.intro.s-icons .links a{opacity:1;transform:none;transition:opacity .4s,transform .4s;transition-delay:calc(var(--i)*55ms)}
.intro .frame{display:block}
html:not(.intro) .frame{display:none}

html.gate .wrap{visibility:hidden}
html.cc,html.cc *{cursor:none!important}
#cur{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.links a:hover svg,.links a:focus-visible svg{filter:drop-shadow(0 0 6px rgba(var(--lav),.55))}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--c);box-shadow:0 0 6px var(--c)}
#tip{position:fixed;left:0;top:0;z-index:30;pointer-events:none;opacity:0;transform:translateY(5px);padding:7px 11px 8px;border-radius:9px;background:rgba(9,7,18,.97);border:1px solid rgba(var(--lav),.32);box-shadow:0 0 16px rgba(var(--lav),.18),0 6px 18px rgba(0,0,0,.6);text-align:center;white-space:nowrap;transition:opacity .16s,transform .16s}
#tip.on{opacity:1;transform:none}
#tip::after{content:"";position:absolute;left:var(--ax,50%);bottom:-5px;width:8px;height:8px;margin-left:-4px;background:rgb(9,7,18);border-right:1px solid rgba(var(--lav),.32);border-bottom:1px solid rgba(var(--lav),.32);transform:rotate(45deg)}
#tip b{display:block;font-size:12px;color:#fff;font-weight:bold}
#tip span{display:block;margin-top:2px;font-size:11px;color:#a9a6c4}
#gate{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;outline:none;user-select:none;-webkit-user-select:none;transition:opacity .25s}
#gate.out{pointer-events:none}
#gate.out .gname,#gate.out .gslot,#gate.out .gmeta,#gate.out>.ctl,#gate.out>.sw{opacity:0;transition:opacity .3s}
.gwrap{display:flex;flex-direction:column;align-items:center}
.gpw{position:relative;width:180px;height:180px;margin-bottom:20px}
.gpfp{position:relative;display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:1px solid rgba(var(--lav),.75);filter:brightness(.7) contrast(1.05);box-shadow:0 0 30px rgba(190,30,50,.25);-webkit-user-drag:none}
.ghaze{position:absolute;left:50%;top:50%;width:260%;height:260%;translate:-50% -50%;border-radius:50%;background:radial-gradient(closest-side,rgba(170,20,40,.32),rgba(110,10,30,.14) 55%,rgba(0,0,0,0));animation:hz 4.5s ease-in-out infinite alternate;pointer-events:none}
@keyframes hz{from{opacity:.6;scale:.94}to{opacity:1;scale:1.06}}
.geg{position:absolute;left:var(--x);top:var(--y);width:24%;height:15%;translate:-50% -50%;rotate:-15deg;transform:scale(calc(1 + var(--prox,0)*.5));opacity:calc(.75 + var(--prox,0)*.25);pointer-events:none;mix-blend-mode:screen}
.geg.a{--x:55.4%;--y:37.8%}.geg.b{--x:33.6%;--y:43.8%}
.geg b{display:block;width:100%;height:100%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,70,90,1),rgba(255,30,60,.55) 45%,rgba(255,20,50,0));animation:br 3.2s ease-in-out infinite,fa 8s ease-in-out infinite}
@keyframes br{0%,100%{opacity:.55;scale:1}50%{opacity:1;scale:1.14}}
@keyframes fa{0%,60%,100%{filter:brightness(1)}70%,84%{filter:brightness(1.9)}94%{filter:brightness(1)}}
.gpw::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,70,90,.85);opacity:0;pointer-events:none}
#gate.burst .geg{transform:scale(2.3);opacity:1;transition:transform .8s ease-out}
#gate.burst .geg b{animation:none;filter:brightness(1.6)}
#gate.burst .gpw::after{animation:ring 1.4s ease-out forwards}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(7);opacity:0}}
#gate.burst::after{content:"";position:absolute;inset:0;background:#ff2a44;pointer-events:none;animation:rf .9s ease-out forwards}
@keyframes rf{0%{opacity:0}25%{opacity:.16}100%{opacity:0}}
#gate.out .ghaze,#gate.out .geg{opacity:0;transition:opacity .5s}
.gname{font-size:1.5em;font-weight:bold;color:#fff}
.gslot{position:relative;width:260px;height:44px;margin-top:18px;display:flex;align-items:center;justify-content:center}
.gload{position:absolute;width:140px;height:2px;background:rgba(255,255,255,.1);overflow:hidden;transition:opacity .4s}
.gload i{display:block;height:100%;background:rgb(var(--lav));transform:scaleX(0);transform-origin:left;animation:fill 1.1s cubic-bezier(.5,0,.3,1) forwards}
@keyframes fill{to{transform:scaleX(1)}}
.ready .gload{opacity:0}
.gbtn{position:absolute;padding:9px 22px;border:1px solid rgba(255,80,100,.4);border-radius:999px;font-size:12px;color:#e6d8e8;background:rgba(14,6,12,.75);box-shadow:0 0 14px rgba(255,40,70,.18);opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s}
.ready .gbtn{opacity:1;transform:none;animation:pulse 2.6s ease-in-out infinite}
.nudge .gbtn{animation:pulse2 1.3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 24px rgba(255,40,70,.36)}}
@keyframes pulse2{50%{box-shadow:0 0 32px rgba(255,40,70,.65);border-color:rgba(255,100,120,.9)}}
.gmeta{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:11px;color:#6f6f7a}
.scr{text-shadow:-2px 0 rgba(255,40,70,.85),2px 0 rgba(0,170,255,.85);color:#cfcbe8}
.intro .meta{opacity:0}
.intro.s-yolo .meta{opacity:1;transition:opacity .5s .2s}
.eg{position:absolute;width:16%;height:10%;left:var(--x);top:var(--y);translate:-50% -50%;rotate:-15deg;border-radius:50%;background:radial-gradient(closest-side,rgba(255,80,100,.95),rgba(255,40,70,.5) 55%,rgba(255,20,50,0));opacity:0;transition:opacity .45s;pointer-events:none;mix-blend-mode:screen}
.eg.a{--x:55.4%;--y:37.8%}.eg.b{--x:33.6%;--y:43.8%}
.pw:hover .eg{opacity:.8}
.intro .eg{display:none}
.intro.landed .pfp{opacity:1;transition:none;animation:lg 1.6s ease-out}
@keyframes lf{0%{transform:translate(-3px,0);filter:drop-shadow(-4px 0 rgba(255,0,60,.85)) drop-shadow(4px 0 rgba(0,170,255,.85))}50%{transform:translate(3px,0);filter:drop-shadow(4px 0 rgba(255,0,60,.85)) drop-shadow(-4px 0 rgba(0,170,255,.85))}100%{transform:none;filter:none}}
@keyframes lg{0%{box-shadow:0 0 0 0 rgba(255,40,60,0)}45%{box-shadow:0 0 30px 4px rgba(255,50,70,.75)}100%{box-shadow:0 0 0 0 rgba(255,40,60,0)}}
.mb{border:0;background:none;padding:0;width:26px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.mb svg{width:22px;height:18px}
.ctl{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:12px;z-index:3}
#gate>.ctl{top:14px;right:16px}
#gate>.sw{top:14px;left:16px}
.sw{position:absolute;top:10px;left:10px;z-index:3;width:34px;height:20px;border:0;padding:0;border-radius:10px;background:#cfcfcf;cursor:pointer;transition:background-color .3s}
.sw::before{content:"";position:absolute;top:1px;left:1px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .3s}
.sw[aria-checked=true]{background:#33313f}.sw[aria-checked=true]::before{transform:translateX(14px)}
.sw:focus-visible{outline:2px solid rgba(var(--lav),.8);outline-offset:2px}
.vbox{position:relative}
.vs{position:absolute;top:26px;right:-8px;width:88px;height:3px;margin:0;background:#fff;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .2s;-webkit-appearance:none;appearance:none;cursor:pointer}
.vs::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
.vs::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
.vbox:hover .vs{opacity:1;pointer-events:auto}
.vbox:has(.vs:focus-visible) .vs{opacity:1;pointer-events:auto}
.vbox::after{content:"";position:absolute;left:-12px;right:-12px;top:100%;height:8px}
.mb:focus-visible{outline:2px solid rgba(var(--lav),.8);outline-offset:2px}
.intro .card .ctl,.intro .card .sw{opacity:0}
.intro.s-card .card .ctl,.intro.s-card .card .sw{opacity:1;transition:opacity .5s}
.av{position:relative;display:inline-block;width:16px;height:16px;margin-right:7px;vertical-align:-4px}
.av img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
.av i{position:absolute;right:-3px;bottom:-3px;width:7px;height:7px;border-radius:50%;background:var(--c);border:1.5px solid #000;box-sizing:content-box;box-shadow:0 0 5px var(--c)}
.av.bad{width:6px;height:6px;margin-right:6px;vertical-align:1px}
.av.bad img{display:none}
.av.bad i{position:static;display:block;width:6px;height:6px;border:0}
.av.big{width:30px;height:30px;margin:0}
.av.big i{width:9px;height:9px;border-color:#09071a}
.av.big.bad{width:7px;height:7px;margin-right:2px}
.av.big.bad i{width:7px;height:7px}
.trow{display:flex;align-items:center;gap:11px;text-align:left}
html.still *,html.still *::before,html.still *::after{animation:none!important;transition:none!important}
html.still .links a:hover,html.still .links a:focus-visible{transform:none}
@media(max-width:450px){.pw{width:80px;height:80px}.name{font-size:1.2em}.sub{font-size:.9em}.links svg{width:32px;height:32px}.links a{height:72px;padding:8px 4px}.links span{font-size:9px}}
</style><script>(function(){var d=document.documentElement,s=0;try{s=localStorage.getItem("anim")=="0"}catch(e){}d.classList.add(s?"still":"intro");if(!s)d.classList.add("gate")})()</script></head>
<body>
<canvas id="sky"></canvas>
<canvas id="cur"></canvas>
<div id="tip" role="tooltip"></div>
<div id="gate" tabindex="0" role="button" aria-label="click to continue">
 <button class="sw" role="switch" aria-checked="true" aria-label="Animations"></button><div class="ctl"><div class="vbox"><button class="mb" aria-label="Mute sound"></button><input class="vs" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Volume"></div></div>
 <div class="gwrap">
  <div class="gpw"><div class="ghaze"></div><img class="gpfp" alt="" draggable="false"><i class="geg a"><b></b></i><i class="geg b"><b></b></i></div>
  <div class="gname">arafath</div>
  <div class="gslot"><div class="gload"><i></i></div><div class="gbtn">click to continue</div></div>
 </div>
 <div class="gmeta" id="gmeta"></div>
</div>

<div class="wrap"><svg class="frame" aria-hidden="true"></svg>
<main class="card">
